[project]
name = "job-search"
version = "0.1.0"
description = "Fetch jobs from JSearch, SerpApi and OpenWeb Ninja, store them in SQLite, score with Claude"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "anthropic>=0.40",
    "openpyxl>=3.1",
    "streamlit>=1.65.0",
    "pypdf>=7.1.1",
    "python-docx>=1.2.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
